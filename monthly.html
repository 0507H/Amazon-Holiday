<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运营工作台/月度跟进</title>
<script>if(window.self!==window.top){document.documentElement.classList.add('embedded');}</script>
<style>
:root{
  --navy:#0E3A57; --teal:#1BA3B8; --coral:#B8423A; --amber:#E08A2E;
  --navy-2:#16496C; --bg:#F2F5F9; --card:#FFFFFF; --line:#E3EAF1;
  --ink:#1C2B36; --sub:#5E7586; --faint:#8FA4B4; --green:#2E9E6B;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;display:flex;min-height:100vh}
html.embedded body{display:block;background:#fff}
/* 自带侧边栏（嵌入门户时隐藏） */
.side{width:192px;flex-shrink:0;background:var(--navy);padding:18px 0 14px;position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
.side::-webkit-scrollbar{width:5px}
.side::-webkit-scrollbar-track{background:transparent}
.side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:3px}
.side::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28)}
html.embedded .side{display:none}
.s-brand{display:flex;gap:10px;align-items:center;padding:0 16px 6px}
.s-brand img{width:32px;height:32px;border-radius:8px}
.s-brand .nm{color:#fff;font-weight:700;font-size:14px;line-height:1.3}
.s-brand .sub{color:#8FB0C8;font-size:11px}
.s-lbl{color:#6E8CA3;font-size:10.5px;padding:14px 16px 6px;letter-spacing:1px}
.s-row{color:#D8E6F0;font-size:13px;padding:9px 16px;cursor:pointer;border-left:3px solid transparent}
.s-row:hover{background:rgba(255,255,255,.06)}
.s-row.on{background:rgba(27,163,184,.22);border-left-color:var(--teal);color:#fff;font-weight:600}
.s-foot{margin-top:26px;color:#6E8CA3;font-size:11px;padding:0 16px;line-height:1.8}
.main{flex:1;min-width:0}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px 48px}
html.embedded .wrap{padding-top:18px}

/* 顶栏 */
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 0}
html.embedded .top{display:none}
.crumb{font-size:13px;color:var(--faint)}
.crumb b{color:var(--ink);font-weight:600}
.crumb .sep{margin:0 6px;color:#C3D1DC}
.top-r{display:flex;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font-size:13px;color:var(--ink);cursor:pointer}
.pill svg{width:15px;height:15px;stroke:var(--navy)}
.pill.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.pill.primary svg{stroke:#fff}

/* 数据源状态条 */
.src{margin-top:16px;background:linear-gradient(90deg,var(--navy),var(--navy-2));border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:24px;color:#fff;flex-wrap:wrap}
.src .tag{font-size:12px;background:rgba(255,255,255,.14);border-radius:6px;padding:4px 10px;letter-spacing:.5px}
.src .item{display:flex;align-items:center;gap:7px;font-size:13px;color:#C8DCEA}
.src .dot{width:7px;height:7px;border-radius:50%;background:#5BD6A4}
.src .dot.warnc{background:#F2B75C}
.src .pace{margin-left:auto;text-align:right;font-size:12px;color:#9FBDD2}
.src .pace b{display:block;font-size:18px;color:#fff;font-weight:700}
.src .pace b i{font-style:normal;font-size:12px;color:#9FBDD2;font-weight:400}

.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.sec-h h2{font-size:16px;font-weight:700;color:var(--navy)}
.sec-h .hint{font-size:12px;color:var(--faint)}

/* KPI 卡 */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:1000px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--teal)}
.kpi.warn::before{background:var(--coral)}
.kpi.mid::before{background:var(--amber)}
.kpi .lb{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.kpi .lb svg{width:14px;height:14px;stroke:var(--faint)}
.kpi .big{font-size:26px;font-weight:700;margin-top:8px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .big small{font-size:13px;font-weight:500;color:var(--faint);letter-spacing:0}
.kpi .sub{font-size:12px;color:var(--faint);margin-top:6px;line-height:1.7}
.up{color:var(--green)} .dn{color:var(--coral)} .wn{color:var(--amber)}

.bar{height:8px;background:#EDF2F7;border-radius:4px;position:relative;margin-top:6px}
.bar .fill{height:100%;border-radius:4px;background:var(--teal)}
.bar .fill.dnb{background:var(--coral)}
.bar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--navy);opacity:.55}
.bar .mark::after{content:attr(data-lb);position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--faint);white-space:nowrap}

/* 店铺卡 */
.store{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.store:hover{border-color:var(--teal);box-shadow:0 4px 16px rgba(14,58,87,.10)}
.store-h{display:flex;align-items:center;justify-content:space-between}
.store-h .nm{font-size:15px;font-weight:700;color:var(--navy)}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600}
.badge.red{background:#F9E8E6;color:var(--coral)}
.badge.amb{background:#FBF0DF;color:#B26F14}
.badge.tl{background:#E2F4F7;color:#0F7A8C}
.tg-row{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.tg-row b{color:var(--ink);font-weight:600}
.mrow{display:flex;justify-content:space-between;margin-top:12px;font-size:13px}
.mrow .k{color:var(--sub)} .mrow .v{font-weight:700;font-variant-numeric:tabular-nums}
.pb-lb{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:10px}
.pb-lb b{color:var(--ink)}
.store-ft{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;font-size:12px;color:var(--faint)}
.store-ft .go{color:var(--teal);font-weight:600}
.refwarn{color:var(--coral);font-weight:600}

/* 面包屑（站内钻取） */
.dcrumb{display:flex;align-items:center;gap:4px;font-size:13px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.dcrumb .c{padding:5px 12px;border-radius:7px;color:var(--sub);cursor:pointer}
.dcrumb .c.on{background:var(--navy);color:#fff;font-weight:600;cursor:default}
.dcrumb .c.lit:hover{background:#EDF3F8;color:var(--navy)}
.dcrumb .a{color:#B9C9D6;font-size:11px}
.stabs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.stab{padding:7px 16px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--sub);cursor:pointer}
.stab:hover{border-color:var(--teal)}
.stab.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600;cursor:default}
.sel{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;background:#fff;color:var(--ink);font-family:inherit;max-width:460px}
.dnote{margin-top:8px;font-size:12px;color:var(--faint);line-height:1.8}
.dnote b{color:var(--amber)}

/* 表格 */
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;font-weight:600;color:var(--faint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);letter-spacing:.5px;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #F0F4F8;white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
.tname{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm{font-weight:600}
.cbar{width:110px;height:6px;background:#EDF2F7;border-radius:3px;display:inline-block;vertical-align:middle;margin-left:8px;overflow:hidden}
.cbar i{display:block;height:100%;border-radius:3px}
.asin{font-family:Consolas,monospace;font-size:12px;color:var(--sub)}
tr.rowbtn{cursor:pointer}
tr.rowbtn:hover td{background:#F3F8FB}
tr.tot td{background:#F6F9FC;font-weight:700;border-top:2px solid var(--line)}

/* 图表 */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media (max-width:900px){.charts{grid-template-columns:1fr}}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.chart-card .ct{font-size:12px;color:var(--sub);margin-bottom:8px;display:flex;justify-content:space-between}
.chart-card .ct b{color:var(--ink)}
.chart-card svg{width:100%;height:70px;display:block}
.xl{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:4px}

/* 数据管理 */
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:900px){.form-grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--sub)}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)}
.field input:focus{outline:2px solid rgba(27,163,184,.35);border-color:var(--teal)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 16px;font-size:13px;color:var(--ink);cursor:pointer;font-family:inherit}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{background:#fff;border-color:var(--coral);color:var(--coral)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status-ok{color:var(--green);font-size:12px;margin-top:8px}
.status-err{color:var(--coral);font-size:12px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:13px;border-radius:8px;padding:10px 18px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
.toast.on{opacity:.96}

.foot{margin-top:26px;font-size:12px;color:var(--faint);line-height:1.9;background:#EDF2F7;border-radius:10px;padding:14px 18px}
.foot b{color:var(--navy)}
</style>
</head>

<script>

  }catch(e){}

let TGT = (function(){

/* rows 字段: [d,st,cat,pa,asin, u,s,p,rf, ad,ads, rev,exp, pur,fba,comm,cpn, ord,ses] */
function agg(rows){
  const o = {u:0,s:0,p:0,rf:0,ad:0,ads:0,rev:0,exp:0,pur:0,fba:0,comm:0,cpn:0,ord:0,ses:0,n:rows.length};
  rows.forEach(r => { o.u+=r[5]; o.s+=r[6]; o.p+=r[7]; o.rf+=r[8]; o.ad+=r[9]; o.ads+=r[10];
    o.rev+=r[11]; o.exp+=r[12]; o.pur+=r[13]; o.fba+=r[14]; o.comm+=r[15]; o.cpn+=r[16]; o.ord+=r[17]; o.ses+=r[18]; });
  o.gm = o.s ? o.p/o.s*100 : 0;
  return o;
}
function byDay(rows){
  const n = DB.days.length, arr = Array.from({length:n},()=>({u:0,s:0,p:0,rf:0}));
  rows.forEach(r => { const a = arr[r[0]]; a.u+=r[5]; a.s+=r[6]; a.p+=r[7]; a.rf+=r[8]; });
  return arr;
}
function groupBy(rows, keyIdx){
  const m = new Map();
  rows.forEach(r => { const k = r[keyIdx]; if(!m.has(k)) m.set(k, []); m.get(k).push(r); });
  return m;
}

/* ================= 格式化 ================= */
function money(v, dec){
  dec = dec === undefined ? 0 : dec;
  const neg = v < 0;
  const s = Math.abs(v).toLocaleString('en-US', {minimumFractionDigits:dec, maximumFractionDigits:dec});
  return (neg?'-':'') + '$' + s;
}
function pctStr(v){ return (Math.round(v*10)/10).toLocaleString('en-US') + '%'; }
function numStr(v){ return Math.round(v).toLocaleString('en-US'); }
function gmCls(v){ return v >= 8 ? 'up' : (v >= 0 ? 'wn' : 'dn'); }
function rateCls(v){ return v >= 30 ? 'up' : (v >= 8 ? 'wn' : 'dn'); }
function timeProg(){ return DB.days.length / (DB.monthDays || 30) * 100; }
function tgtOf(i){ return TGT[String(i)] || {u:0,p:0,g:0}; }

/* ================= 图表 ================= */
function svgBars(vals, color){
  const n = vals.length, W = 300, H = 70, max = Math.max(...vals, 1);
  const bw = W/n - 3;
  let out = '';
  vals.forEach((v,i) => {
    const h = Math.max(1, v/max*H);
    out += `<rect x="${(i*(W/n)).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${color}" opacity="${v?0.9:0.25}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${out}</svg>`;
}
function svgLine(vals, color){
  const n = vals.length, W = 300, H = 70;
  let mn = Math.min(...vals, 0), mx = Math.max(...vals, 1);
  const span = mx - mn || 1;
  const y = v => H - (v - mn)/span*(H-6) - 3;
  let pts = vals.map((v,i) => `${(n===1?W/2:i*(W/(n-1))).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  let zero = (mn < 0 && mx > 0) ? `<line x1="0" y1="${y(0).toFixed(1)}" x2="${W}" y2="${y(0).toFixed(1)}" stroke="#B9C9D6" stroke-dasharray="3 3" stroke-width="1"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${zero}<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function dayLabels(){ return [DB.days[0].slice(5), DB.days[Math.floor(DB.days.length/2)].slice(5), DB.days[DB.days.length-1].slice(5)]; }

const $app = document.getElementById('app');

function parseHash(){
  const q = {};

  return q;
}
function navTo(q){
  let h = 'v=' + q.v;
  if(q.st !== undefined) h += '&st=' + q.st;
  if(q.c !== undefined) h += '&c=' + q.c;
  if(q.pa !== undefined) h += '&pa=' + q.pa;
  if(q.a !== undefined) h += '&a=' + q.a;
  location.hash = h;
}

/* ================= 拆解链路：总览→店铺→品类→父体→单品→数据层面（平级） ================= */
function levelCrumb(st, cur){
  const steps = [['ov','总览'],['st','店铺'],['cat','品类'],['pt','父体'],['sku','单品'],['dt','数据']];
  return '<div class="dcrumb">' + steps.map(s => {
    if(s[0] === cur) return `<span class="c on">${s[1]}</span>`;
    return `<span class="c lit" data-v="${s[0]}"${s[0] === 'ov' ? '' : ` data-st="${st}"`}>${s[1]}</span>`;
  }).join('<span class="a">▸</span>') + '</div>';
}
function storeTabs(st, v){
  return '<div class="stabs">' + DB.stores.map((nm, i) =>
    `<span class="stab ${i === st ? 'on' : ''}" data-v="${v}" data-st="${i}">${esc(nm)}</span>`).join('') + '</div>';
}
function selHtml(st, navV, paramKey, placeholder, opts, cur){
  return `<select class="sel" data-nav="1" data-v="${navV}" data-st="${st}" data-param="${paramKey}">
    <option value="all">${placeholder}</option>
    ${opts.map(o => `<option value="${o.v}"${String(o.v) === String(cur) ? ' selected' : ''}>${esc(o.lb)}</option>`).join('')}
  </select>`;
}
function repNameOf(rows, pi){
  let best = -1, bi = 0;
  groupBy(rows.filter(r => r[F.pa] === pi), F.a).forEach((ars, ai) => {
    const u = agg(ars).u; if(u > best){ best = u; bi = ai; }
  });
  return DB.names[bi];
}

/* XLSX 懒加载 */
let _xlsxP = null;
function ensureXLSX(){
  if(window.XLSX) return Promise.resolve();
  if(!_xlsxP){
    _xlsxP = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      s.onload = res;
      s.onerror = () => { _xlsxP = null; rej(new Error('解析组件加载失败（需要联网），可稍后重试')); };
      document.head.appendChild(s);
    });
  }
  return _xlsxP;
}
function jnum(v, nd){
  nd = nd === undefined ? 2 : nd;
  if(v === null || v === undefined || v === '-' || v === '') return 0;
  const f = typeof v === 'number' ? v : parseFloat(String(v).replace(/[^0-9.\-]/g,''));
  if(isNaN(f)) return 0;
  if(nd === 0) return Math.round(f);
  const r = Math.round(f*100)/100;
  return Number.isInteger(r) ? r : r;
}
async function parseDailyXlsx(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const shName = wb.SheetNames.find(n => n.includes('按日导出')) || wb.SheetNames[0];
  const arr = XLSX.utils.sheet_to_json(wb.Sheets[shName], {header:1, raw:true});
  const head = arr[0].map(h => String(h).trim());
  const ix = {}; head.forEach((h,i) => ix[h] = i);
  const col = k => ix[k];
  const days = [], stores = [], cats = [], parents = [], asins = [], names = [];
  const dateidx = {}, rows = [];
  for(let ri = 1; ri < arr.length; ri++){
    const r = arr[ri];
    if(!r || r[col('日期')] === undefined || r[col('日期')] === null) continue;
    let d = String(r[col('日期')]).slice(0,10);
    if(/^\d$/.test(d) || !d.includes('-')){ /* Excel 序列日期 */
      const ser = Number(r[col('日期')]);
      if(!isNaN(ser) && ser > 40000){ const dt = new Date(Math.round((ser - 25569)*86400000)); d = dt.toISOString().slice(0,10); }
    }
    if(!dateidx.hasOwnProperty(d)){ dateidx[d] = days.length; days.push(d); }
    let store = String(r[col('店铺')] || '').split('(')[0].split('（')[0].trim().split('-').pop().trim();
    if(store && !stores.includes(store)) stores.push(store);
    const st = stores.indexOf(store);
    const cat = String(r[col('品类')] || '未分类');
    if(!cats.includes(cat)) cats.push(cat);
    const a = String(r[col('ASIN')] || '');
    let pa = String(r[col('父ASIN')] || a);
    if(pa === '-' || pa === 'None' || !pa) pa = a;
    if(!parents.includes(pa)) parents.push(pa);
    if(!asins.includes(a)){ asins.push(a); names[a] = String(r[col('产品名称')] || a).slice(0,60); }
    const g = (k, nd) => jnum(r[col(k)], nd);
    rows.push([
      dateidx[d], st, cats.indexOf(cat), parents.indexOf(pa), asins.indexOf(a),
      g('销量',0), g('销售额'), g('销售净毛利'), g('退款量',0),
      g('广告花费'), g('广告销售额'), g('总收入'), g('总支出'),
      g('采购成本'), g('FBA配送费'), g('销售佣金'), g('Coupon花费'),
      g('订单量',0), g('Sessions-Total',0)
    ]);
  }
  return {
    version: new Date().toISOString().slice(0,10), month: '2026-11', monthDays: 30,
    days, stores, cats, parents, asins,
    names: asins.map(a => names[a]), inv: asins.map(a => [0,0]),
    targets: JSON.parse(JSON.stringify(DB.targets || {})), rows
  };
}
async function applySummaryXlsx(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const shName = wb.SheetNames.find(n => n.includes('主列表')) || wb.SheetNames[0];
  const arr = XLSX.utils.sheet_to_json(wb.Sheets[shName], {header:1, raw:true});
  const head = arr[0].map(h => String(h).trim());
  const ix = {}; head.forEach((h,i) => ix[h] = i);
  const invKey = head.find(h => h.includes('FBA可售') && !h.includes('周转')) || 'FBA可售';
  const tovKey = head.find(h => h.includes('FBA可售周转')) || 'FBA可售周转';
  let matched = 0;
  const invMap = {};
  for(let ri = 1; ri < arr.length; ri++){
    const r = arr[ri];
    const a = String(r[ix['ASIN']] || '');
    if(!a) continue;
    invMap[a] = [jnum(r[ix[invKey]],0), jnum(r[ix[tovKey]],0)];
  }
  DB.inv = DB.asins.map(a => { if(invMap.hasOwnProperty(a)){ matched++; return invMap[a]; } return [0,0]; });
  return matched;
}

  const q = parseHash();
  const v = q.v || 'ov';
  if(v === 'st') vStore(Number(q.st) || 0);
  else if(v === 'cat') vCatPage(Number(q.st) || 0);
  else if(v === 'pt') vParentPage(Number(q.st) || 0, q.c);
  else if(v === 'sku') vSkuPage(Number(q.st) || 0, q.pa);
  else if(v === 'dt') vDetail(Number(q.st) || 0, q.a);
  else if(v === 'data') vData();
  else if(v === 'rep') vRep();
  else vOv();
  syncSide(v, q);
  window.parent && window.parent.postMessage({type:'monthly-view', v, q}, '*');
}
document.getElementById('monthPill').textContent = (DB.month || '').replace('-', '年') + '月' ;
render();
</script>
</body>
