<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务管理 · 脆脆鲨工作台</title>
<style>
:root{
  --navy:#0E3A57; --teal:#1BA3B8; --coral:#B8423A; --amber:#E08A2E;
  --bg:#F2F7FA; --card:#FFFFFF; --line:#E3E8ED; --line2:#EEF1F4;
  --t1:#12212E; --t2:#64748B; --t3:#8797A6;
  --tint-blue:#E7F3F7; --tint-red:#FBEDEA; --tint-amber:#FCF2E2; --tint-green:#E9F5F0;
  --r:9px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--t1);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;padding:16px 20px 26px}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
html.embedded .hd>div:first-child{display:none}
html.embedded .hd{justify-content:flex-end;margin-bottom:6px}
.hd h1{font-size:15px;font-weight:500}
.hd .sub{font-size:12px;color:var(--t2);margin-top:3px}
.hd .act{display:flex;gap:8px;align-items:center}
.btn{font-size:12px;padding:5px 11px;border-radius:5px;border:1px solid #D7DEE5;background:#fff;color:#33475B;cursor:pointer}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{color:var(--coral)}
.btn:hover{opacity:.9}
.tabs{display:flex;gap:4px;margin-bottom:14px;background:#E7EDF2;border-radius:8px;padding:3px;width:fit-content}
.tab{font-size:12.5px;padding:5px 16px;border-radius:6px;cursor:pointer;color:var(--t2)}
.tab.on{background:#fff;color:var(--navy);font-weight:500}
.sumline{font-size:12.5px;color:var(--t2);margin-bottom:12px}
.sumline b{color:var(--navy);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:10px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.card-hd .t{font-size:13px;font-weight:500}
.card-hd .n{font-size:11px;color:var(--t3)}
.card.red{border-left:3px solid var(--coral)}
.card.amber{border-left:3px solid var(--amber)}
.card.teal{border-left:3px solid var(--teal)}
.card.plain{border-left:none}
.row{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line2);min-width:0}
.row:first-child{border-top:none}
.row.compact{padding:6px 0}
.box{width:13px;height:13px;border:1.4px solid #C6CFD8;border-radius:3px;flex:none;cursor:pointer;position:relative}
.box.done{background:var(--teal);border-color:var(--teal)}
.box.done::after{content:"";position:absolute;left:3px;top:1px;width:4px;height:7px;border:1.5px solid #fff;
  border-top:0;border-left:0;transform:rotate(42deg)}
.nm{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex-shrink:1}
.row.done .nm{color:#9AA9B6;text-decoration:line-through}
.tag{font-size:11px;padding:1.5px 6px;border-radius:3px;flex:none;white-space:nowrap}
.tag.red{background:var(--tint-red);color:var(--coral)}
.tag.amber{background:var(--tint-amber);color:#A06A18}
.tag.teal{background:var(--tint-blue);color:#1B93A6}
.tag.green{background:var(--tint-green);color:#1F6B4F}
.tag.gray{background:#EEF1F4;color:var(--t3)}
.meta{margin-left:auto;font-size:11px;color:var(--t3);flex:none;white-space:nowrap}
.acts{display:flex;gap:5px;flex:none}
.mini{font-size:11px;color:var(--t3);border:1px solid var(--line2);background:#fff;border-radius:4px;padding:1.5px 7px;cursor:pointer}
.mini:hover{color:var(--teal);border-color:#CFDDE6}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar input[type=text]{flex:1;min-width:180px;font-size:12.5px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--t1);outline:none}
.bar select{font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--t1)}
.empty{font-size:12px;color:var(--t3);padding:18px 0;text-align:center}
.rate-num{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.rate-num b{font-size:21px;font-weight:500;color:var(--navy)}
.rate-num span{font-size:11px;color:var(--t3)}
.pbar{height:5px;border-radius:3px;background:#E3E8ED;overflow:hidden;margin-bottom:4px}
.pbar i{display:block;height:100%;background:var(--teal)}
.mod-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--t2);padding:3px 0}
.report pre{white-space:pre-wrap;font-family:inherit;font-size:12px;color:var(--t2);line-height:1.8;background:#F8FAFC;
  border:1px solid var(--line2);border-radius:7px;padding:10px 12px;margin-top:8px;max-height:320px;overflow:auto}
.mask{position:fixed;inset:0;background:rgba(14,42,60,.35);display:none;align-items:center;justify-content:center;z-index:50}
.mask.on{display:flex}
.modal{background:#fff;border-radius:10px;padding:18px 20px;width:440px;max-width:92vw;max-height:88vh;overflow:auto}
.modal h3{font-size:14px;font-weight:500;margin-bottom:14px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frm .full{grid-column:1/-1}
.frm label{font-size:11.5px;color:var(--t2);display:block;margin-bottom:3px}
.frm input,.frm select,.frm textarea{width:100%;font-size:12.5px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;
  background:#fff;color:var(--t1);outline:none;font-family:inherit}
.frm textarea{resize:vertical;min-height:54px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
</style>
</head>
<body>
<div class="hd">
  <div>
    <h1>月度任务工作台</h1>
    <div class="sub" id="subTitle"></div>
  </div>
  <div class="act">
    <button class="btn" id="btnExport">导出</button>
    <button class="btn primary" id="btnNew">+ 新建任务</button>
  </div>
</div>

<div class="tabs">
  <div class="tab on" data-tab="today">今日</div>
  <div class="tab" data-tab="month">本月全量</div>
  <div class="tab" data-tab="report">报告</div>
  <div class="tab" data-tab="data">数据</div>
</div>

<div id="viewToday"></div>
<div id="viewMonth" style="display:none"></div>
<div id="viewReport" style="display:none"></div>
<div id="viewData" style="display:none"></div>

<div class="mask" id="mask">
  <div class="modal">
    <h3 id="mTitle">新建任务</h3>
    <div class="frm">
      <div class="full"><label>任务名称</label><input type="text" id="fTitle" placeholder="例如：SB广告*5"></div>
      <div><label>店铺分组</label><select id="fGroup"><option>AVAN</option><option>Take</option><option>Tivo</option><option>未分组</option></select></div>
      <div><label>模块</label><select id="fModule"><option>广告</option><option>滞销清理</option><option>品类</option><option>链接</option><option>新品</option><option>库存</option><option>父体</option><option>万圣清理</option><option>其他</option></select></div>
      <div><label>开始日期</label><input type="date" id="fStart"></div>
      <div><label>截止日期</label><input type="date" id="fDue"></div>
      <div class="full"><label>循环规则</label><select id="fRule">
        <option value="">不循环</option><option value="FREQ=WEEKLY;BYDAY=MO">每周一</option>
        <option value="FREQ=WEEKLY;BYDAY=TU">每周二</option><option value="FREQ=WEEKLY;BYDAY=WE">每周三</option>
        <option value="FREQ=WEEKLY;BYDAY=TH">每周四</option><option value="FREQ=WEEKLY;BYDAY=FR">每周五</option>
        <option value="FREQ=WEEKLY;BYDAY=SA">每周六</option><option value="FREQ=WEEKLY;BYDAY=SU">每周日</option>
        <option value="FREQ=DAILY">每天</option>
      </select></div>
      <div class="full"><label>备注 / 完成效果</label><textarea id="fNote" placeholder="完成后可记录效果，例如：ACOS 从 35% 降到 28%"></textarea></div>
    </div>
    <div class="foot">
      <button class="btn" id="mCancel">取消</button>
      <button class="btn danger" id="mDelete">删除</button>
      <button class="btn primary" id="mSave">保存</button>
    </div>
  </div>
</div>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso = (ts) => { const d = new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const dayStart = (v) => { const d = new Date(v); d.setHours(0,0,0,0); return d.getTime(); };
const today0 = () => dayStart(new Date());
const todayIso = () => iso(new Date());

/* ---------- 循环规则 ---------- */
function parseRRule(rule){
  const m = {};
  String(rule||'').split(';').forEach(p => { const kv = p.split('='); if(kv[0]) m[kv[0].toUpperCase()] = kv[1]; });
  const map = {SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6};
  return { freq:(m.FREQ||'').toUpperCase(), interval:Math.max(1,parseInt(m.INTERVAL||'1',10)||1),
    byday:(m.BYDAY||'').split(',').filter(Boolean).map(d=>map[d.trim().toUpperCase()]).filter(v=>v!==undefined) };
}
function occurrences(rule, fromTs, toTs){
  const r = parseRRule(rule), out = [];
  if(!rule || toTs < fromTs) return out;
  if(r.freq === 'WEEKLY' && r.byday.length){
    for(let ts = dayStart(fromTs); ts <= toTs; ts += DAY){ if(r.byday.includes(new Date(ts).getDay())) out.push(ts); }
  } else if(r.freq === 'DAILY'){
    for(let ts = dayStart(fromTs); ts <= toTs; ts += DAY * r.interval) out.push(ts);
  }
  return out;
}
function routineLabel(rule){
  const r = parseRRule(rule);
  const dayMap = {0:'每周日',1:'每周一',2:'每周二',3:'每周三',4:'每周四',5:'每周五',6:'每周六'};
  if(r.freq === 'DAILY') return '每天';
  if(r.freq === 'WEEKLY' && r.byday.length === 1) return dayMap[r.byday[0]] || '每周';
  if(r.freq === 'WEEKLY' && r.byday.length > 1) return '每周' + r.byday.length + '天';
  return '循环';
}

/* ---------- 状态判定 ---------- */
function isDoneOn(t, ts0){
  if(t.rrule) return (t.done_dates || []).includes(iso(ts0));
  return !!t.done;
}
function statusOf(t, ts0){
  const due = t.due ? dayStart(t.due) : null;
  if(!t.rrule && t.done) return { key:'done', label:'已完成', cls:'green', due };
  if(due === null) return { key:'none', label:'无日期', cls:'gray', due:null };
  if(t.rrule){
    const missed = occurrences(t.rrule, due + DAY, ts0 - DAY).filter(ts => !(t.done_dates||[]).includes(iso(ts))).length;
    if(missed > 0) return { key:'over', label:'漏卡 ' + missed + ' 次', cls:'red', due, missed };
    if(occurrences(t.rrule, ts0, ts0).length && (t.done_dates||[]).includes(iso(ts0)))
      return { key:'routineDone', label:'今日已完成', cls:'green', due };
    if(occurrences(t.rrule, ts0, ts0).length) return { key:'routine', label: routineLabel(t.rrule), cls:'teal', due };
    const next = occurrences(t.rrule, ts0 + DAY, ts0 + 31*DAY)[0];
    if(due > ts0) return { key:'later', label:(due - ts0) / DAY < 1 ? '今天' : Math.round((due-ts0)/DAY) + ' 天后', cls:due === ts0 + DAY ? 'amber' : 'gray', due };
    if(next) return { key:'later', label:'下次 ' + iso(next).slice(5), cls:'gray', due:next };
    return { key:'later', label:'已过周期', cls:'gray', due };
  }
  if(due < ts0) return { key:'over', label:'逾期 ' + Math.round((ts0-due)/DAY) + ' 天', cls:'red', due };
  if(due === ts0) return { key:'today', label:'今天截止', cls:'amber', due };
  const dd = Math.round((due - ts0) / DAY);
  return { key:'later', label: dd === 1 ? '明天' : dd + ' 天后', cls: dd <= 7 ? 'amber' : 'gray', due };
}

/* ---------- 今日视图 ---------- */
function renderToday(){
  const t0 = today0();
  const t0Iso = todayIso();
  let over = 0, dueToday = 0, routine = 0, miss = 0;
  const buckets = { over:[], today:[], routine:[], week:[] };
  TASKS.forEach(t => {
    const st = statusOf(t, t0);
    if(st.key === 'done' || st.key === 'routineDone') return;
    const due = st.due != null ? st.due : null;
    if(st.key === 'over'){
      buckets.over.push({t, st});
      if(t.rrule) miss += st.missed; else over++;
    }
    else if(st.key === 'today'){ buckets.today.push({t, st}); dueToday++; }
    else if(st.key === 'routine'){ buckets.routine.push({t, st}); routine++; }
    else if(st.due != null && st.due > t0 && st.due <= t0 + 7*DAY) buckets.week.push({t, st});
  });
  const sortFn = (a,b) => (a.st.due||0) - (b.st.due||0);
  buckets.over.sort(sortFn); buckets.today.sort(sortFn); buckets.routine.sort(sortFn); buckets.week.sort(sortFn);

  const weekCN = '日一二三四五六'[new Date(t0).getDay()];
  let html = '<div class="sumline">' + iso(t0).slice(5) + ' 周' + weekCN
    + ' · 逾期 <b>' + over + '</b> · 循环漏卡 <b>' + miss + '</b> · 今日到期 <b>' + dueToday + '</b> · 今日例行 <b>' + routine + '</b></div>';

  const mk = (title, arr, cls, extra) => {
    if(!arr.length) return '<div class="card plain ' + cls + '"><div class="card-hd"><div class="t">' + title + '</div><div class="n">0 条</div></div><div class="empty">没有需要处理的任务</div></div>';
    return '<div class="card ' + cls + '"><div class="card-hd"><div class="t">' + title + '</div><div class="n">' + arr.length + ' 条</div></div>'
      + arr.map(r => rowHtml(r.t, r.st, extra)).join('') + '</div>';
  };
  html += mk('风险与逾期（含循环漏卡）', buckets.over, 'red', 'over');
  html += mk('今日到期', buckets.today, 'amber', 'today');
  html += mk('今日例行', buckets.routine, 'teal', 'routine');
  html += mk('未来 7 天到期', buckets.week, 'plain', 'week');
  $('viewToday').innerHTML = html;
}

function rowHtml(t, st, mode){
  const meta = [t.group, t.module, t.parent ? '父·' + t.parent : ''].filter(Boolean).map(esc).join(' · ');
  const tags = [];
  if(mode === 'over' && st.missed) tags.push('<span class="tag red">漏卡 ' + st.missed + '</span>');
  if(mode === 'over' && !t.rrule) tags.push('<span class="tag red">逾期 ' + Math.round((today0()-st.due)/DAY) + ' 天</span>');
  if(mode === 'today') tags.push('<span class="tag amber">今天截止</span>');
  if(mode === 'routine') tags.push('<span class="tag teal">' + routineLabel(t.rrule) + '</span>');
  if(mode === 'week'){ const dd = Math.round((st.due - today0()) / DAY); tags.push('<span class="tag ' + (dd <= 3 ? 'amber' : 'gray') + '">' + (dd === 1 ? '明天' : dd + ' 天后') + '</span>'); }
  if(t.rrule && mode !== 'routine') tags.push('<span class="tag teal">' + routineLabel(t.rrule) + '</span>');
  const doneToday = isDoneOn(t, today0());
  const postpone = (mode === 'over' && !t.rrule) ? '<button class="mini" data-postpone="' + t.id + '">改到今天</button>' : '';
  return '<div class="row" data-row="' + t.id + '">'
    + '<div class="box ' + (doneToday ? 'done' : '') + '" data-check="' + t.id + '"></div>'
    + '<div class="nm" title="' + esc(t.title) + '">' + esc(t.title) + '</div>'
    + tags.join('')
    + '<span class="meta">' + meta + '</span>'
    + '<span class="acts">' + postpone + '<button class="mini" data-edit="' + t.id + '">编辑</button></span>'
    + '</div>';
}

/* ---------- 本月全量 ---------- */
let filter = { q:'', group:'', module:'', status:'' };
function renderMonth(){
  const t0 = today0();
  const groups = [...new Set(TASKS.map(t => t.group).filter(Boolean))];
  const modules = [...new Set(TASKS.map(t => t.module).filter(Boolean))];
  let list = TASKS.filter(t => {
    if(filter.q && !t.title.toLowerCase().includes(filter.q.toLowerCase())) return false;
    if(filter.group && t.group !== filter.group) return false;
    if(filter.module && t.module !== filter.module) return false;
    const st = statusOf(t, t0);
    if(filter.status === 'pending' && (st.key === 'done' || st.key === 'routineDone')) return false;
    if(filter.status === 'over' && st.key !== 'over') return false;
    if(filter.status === 'today' && !(st.key === 'today' || st.key === 'routine')) return false;
    if(filter.status === 'done' && !(st.key === 'done' || st.key === 'routineDone')) return false;
    return true;
  });
  list.sort((a,b) => {
    const sa = statusOf(a, t0), sb = statusOf(b, t0);
    const rank = (s) => s.key === 'over' ? 0 : s.key === 'today' ? 1 : s.key === 'routine' ? 2 : (s.due != null ? 3 : 4);
    return rank(sa) - rank(sb) || (sa.due||0) - (sb.due||0);
  });

  let html = '<div class="bar">'
    + '<input type="text" id="fQ" placeholder="搜索任务名称…" value="' + esc(filter.q) + '">'
    + '<select id="fGroup2"><option value="">全部分组</option>' + groups.map(g => '<option' + (filter.group === g ? ' selected' : '') + '>' + esc(g) + '</option>').join('') + '</select>'
    + '<select id="fModule2"><option value="">全部模块</option>' + modules.map(g => '<option' + (filter.module === g ? ' selected' : '') + '>' + esc(g) + '</option>').join('') + '</select>'
    + '<select id="fStatus2"><option value="">全部状态</option>'
    + '<option value="pending"' + (filter.status === 'pending' ? ' selected' : '') + '>未完成</option>'
    + '<option value="over"' + (filter.status === 'over' ? ' selected' : '') + '>逾期/漏卡</option>'
    + '<option value="today"' + (filter.status === 'today' ? ' selected' : '') + '>今天</option>'
    + '<option value="done"' + (filter.status === 'done' ? ' selected' : '') + '>已完成</option></select>'
    + '<span style="font-size:11.5px;color:var(--t3);align-self:center">' + list.length + ' 条</span></div>';
  html += list.length
    ? '<div class="card plain">' + list.map(t => rowHtml(t, statusOf(t, t0), 'month')).join('') + '</div>'
    : '<div class="empty">没有匹配的任务</div>';
  $('viewMonth').innerHTML = html;

  $('fQ').addEventListener('input', (e) => { filter.q = e.target.value; refreshMonth(); });
  $('fGroup2').addEventListener('change', (e) => { filter.group = e.target.value; refreshMonth(); });
  $('fModule2').addEventListener('change', (e) => { filter.module = e.target.value; refreshMonth(); });
  $('fStatus2').addEventListener('change', (e) => { filter.status = e.target.value; refreshMonth(); });
}
let monthTimer = null;
function refreshMonth(){ clearTimeout(monthTimer); monthTimer = setTimeout(renderMonth, 150); }

/* ---------- 报告 ---------- */
function monthDoneCount(){
  const now = new Date();
  let n = 0;
  TASKS.forEach(t => {
    if(t.rrule){ (t.done_dates||[]).forEach(d => { const dt = new Date(d); if(dt.getMonth() === now.getMonth()) n++; }); }
    else if(t.done && t.done_at && new Date(dayStart(t.done_at)).getMonth() === now.getMonth()) n++;
  });
  return n;
}

    return '【日报】' + t0Iso + '\n'
      + '今日完成 ' + doneToday.length + ' 条：' + (doneToday.map(t => t.title).join('、') || '暂无') + '\n'
      + '今日待处理 ' + rows.length + ' 条（逾期/漏卡 ' + over + ' 条）\n'
      + rows.slice(0, 10).map(r => '  - ' + r.t.title + (r.st.missed ? '（漏卡' + r.st.missed + '）' : '')).join('\n')
      + '\n剩余未完成 ' + TASKS.filter(t => { const s = statusOf(t, t0); return s.key !== 'done' && s.key !== 'routineDone'; }).length + ' 条';
  }
  if(kind === 'week'){
    const w0 = t0 - 6*DAY;
    const doneWeek = TASKS.filter(t => {
      if(t.rrule) return (t.done_dates||[]).some(d => { const ts = dayStart(d); return ts >= w0 && ts <= t0; });
      return t.done && t.done_at && dayStart(t.done_at) >= w0 && dayStart(t.done_at) <= t0;
    });
    const byGroup = {};
    TASKS.forEach(t => { if(t.group) byGroup[t.group] = byGroup[t.group] || {d:0, m:0}; });
    TASKS.forEach(t => {
      const g = byGroup[t.group]; if(!g) return;
      const isD = t.rrule ? (t.done_dates||[]).some(d => { const ts = dayStart(d); return ts >= w0 && ts <= t0; })
        : (t.done && t.done_at && dayStart(t.done_at) >= w0 && dayStart(t.done_at) <= t0);
      if(isD) g.d++;
    });
    const overdue = TASKS.filter(t => statusOf(t, t0).key === 'over').length;
    const miss = TASKS.reduce((s,t) => s + (statusOf(t, t0).missed || 0), 0);
    return '【周报】近 7 天（' + fmtD(w0) + ' ~ ' + fmtD(t0) + '）\n'
      + '完成 ' + doneWeek.length + ' 条：' + doneWeek.slice(0, 12).map(t => t.title).join('、') + '\n'
      + Object.keys(byGroup).map(g => '  - ' + g + '：完成 ' + byGroup[g].d + ' 条').join('\n') + '\n'
      + '当前逾期/漏卡 ' + overdue + ' 条，循环漏卡合计 ' + miss + ' 次\n'
      + (miss > 0 ? '行动项：优先补做循环漏卡' : '行动项：本周循环任务执行到位，保持');
  }
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 1).getTime() - DAY;
  const inMonth = TASKS.filter(t => t.due && dayStart(t.due) >= monthStart && dayStart(t.due) <= monthEnd);
  const byMod = {};
  inMonth.forEach(t => { byMod[t.module || '其他'] = byMod[t.module || '其他'] || {d:0, m:0};
    const isD = t.rrule ? (t.done_dates||[]).some(d => dayStart(d) <= t0)
      : (t.done && t.done_at && dayStart(t.done_at) <= t0);
    if(isD) byMod[t.module || '其他'].d++; else byMod[t.module || '其他'].m++; });
  const doneN = monthDoneCount();
  const rate = inMonth.length ? Math.round(doneN / inMonth.length * 100) : 0;
  return '【月报】' + now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '\n'
    + '本月任务 ' + inMonth.length + ' 条，已完成 ' + doneN + ' 条（' + rate + '%）\n'
    + Object.keys(byMod).map(m => '  - ' + m + '：完成 ' + byMod[m].d + ' / 未完 ' + byMod[m].m).join('\n') + '\n'
    + '月度四问：哪些要加码（完成率高模块）· 哪些要重做（逾期集中模块）· 哪些清库存（滞销/万圣）· 下月预算怎么分';
}
function todayList(){
  const t0 = today0(), rows = [];
  TASKS.forEach(t => {
    const st = statusOf(t, t0);
    if(st.key === 'over' || st.key === 'today' || st.key === 'routine') rows.push({t, st});
  });
  return rows;
}
function renderReport(){
  $('viewReport').innerHTML = ['day','week','month'].map(k => {
    const name = k === 'day' ? '日报' : k === 'week' ? '周报' : '月报';
    return '<div class="card plain report"><div class="card-hd"><div class="t">' + name + '</div>'
      + '<span class="acts"><button class="mini" data-gen="' + k + '">生成</button>'
      + '<button class="mini" data-copy="' + k + '">复制文本</button></span></div>'
      + '<pre id="rep-' + k + '">点击「生成」查看</pre></div>';
  }).join('') + '<div class="hint" style="font-size:11px;color:var(--t3);text-align:right;margin-top:6px">基于本地完成记录自动汇总</div>';
}

/* ---------- 数据 ---------- */
function renderData(){
  $('viewData').innerHTML = '<div class="card plain"><div class="card-hd"><div class="t">数据管理</div></div>'
    + '<div style="font-size:12px;color:var(--t2);line-height:2">'
    + '当前本地数据 <b>' + TASKS.length + '</b> 条'
    + (SEED ? '（飞书种子 ' + SEED.fetched_at.slice(0,10) + '）' : '')
    + '<br>数据保存在浏览器 localStorage，与首页驾驶舱共用；换设备请用导出/导入迁移。'
    + '</div>'
    + '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'
    + '<button class="btn" id="dExport">导出 JSON</button>'
    + '<button class="btn" id="dImport">导入 JSON</button>'
    + '<input type="file" id="dFile" accept=".json" style="display:none">'
    + '<button class="btn" id="dSeed">重置为飞书种子</button>'
    + '</div></div>';
  $('dExport').addEventListener('click', exportJson);
  $('dImport').addEventListener('click', () => $('dFile').click());
  $('dFile').addEventListener('change', importJson);
  $('dSeed').addEventListener('click', () => {
    if(!SEED) return alert('页面里没有种子数据');
    if(!confirm('将本地 ' + TASKS.length + ' 条任务重置为种子数据（' + SEED.tasks.length + ' 条），当前完成记录会丢失。继续？')) return;
    TASKS = JSON.parse(JSON.stringify(SEED.tasks)); save(); renderAll();
  });
}

function exportJson(){
  const blob = new Blob([JSON.stringify({version:1, tasks:TASKS, exported_at:new Date().toISOString()}, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lfh-tasks-' + todayIso() + '.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importJson(e){
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const o = JSON.parse(rd.result);
      const arr = Array.isArray(o) ? o : o.tasks;
      if(!Array.isArray(arr) || !arr.length) throw new Error('格式不对');
      TASKS = arr; save(); renderAll();
      alert('已导入 ' + TASKS.length + ' 条任务');
    }catch(err){ alert('导入失败：' + err.message); }
  };
  rd.readAsText(f, 'utf8');
}

/* ---------- 编辑 ---------- */
let editing = null;
function openModal(id){
  const t = id ? TASKS.find(x => x.id === id) : null;
  editing = t || null;
  $('mTitle').textContent = t ? '编辑任务' : '新建任务';
  $('fTitle').value = t ? t.title : '';
  $('fGroup').value = t && t.group ? t.group : '未分组';
  $('fModule').value = t && t.module ? t.module : '其他';
  $('fStart').value = t && t.start ? t.start : '';
  $('fDue').value = t && t.due ? t.due : '';
  $('fRule').value = t && t.rrule ? t.rrule : '';
  $('fNote').value = t && t.note ? t.note : '';
  $('mDelete').style.display = t ? '' : 'none';
  $('mask').classList.add('on');
  $('fTitle').focus();
}
$('mCancel').addEventListener('click', () => $('mask').classList.remove('on'));
$('mask').addEventListener('click', (e) => { if(e.target === $('mask')) $('mask').classList.remove('on'); });
$('mDelete').addEventListener('click', () => {
  if(!editing || !confirm('删除「' + editing.title + '」？')) return;
  TASKS = TASKS.filter(x => x.id !== editing.id);
  save(); $('mask').classList.remove('on'); renderAll();
});
$('mSave').addEventListener('click', () => {
  const title = $('fTitle').value.trim();
  if(!title) return alert('请填写任务名称');
  const data = {
    title, group: $('fGroup').value, module: $('fModule').value,
    start: $('fStart').value, due: $('fDue').value,
    rrule: $('fRule').value, note: $('fNote').value.trim()
  };
  if(editing) Object.assign(editing, data);
  else TASKS.push(Object.assign({ id:'t' + Date.now(), done:false, done_at:'', done_dates:[], parent:'' }, data));
  save(); $('mask').classList.remove('on'); renderAll();
});

/* ---------- 交互 ---------- */
function switchTab(k){
  if(!['today','month','report','data'].includes(k)) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.tab === k));
  ['today','month','report','data'].forEach(kk => $('view' + kk[0].toUpperCase() + kk.slice(1)).style.display = kk === k ? '' : 'none');
  if(k === 'report') renderReport();
  if(k === 'data') renderData();
}
document.querySelectorAll('.tab').forEach(tb => tb.addEventListener('click', () => switchTab(tb.dataset.tab)));

document.body.addEventListener('click', (e) => {
  const chk = e.target.closest('[data-check]');
  if(chk){
    const t = TASKS.find(x => x.id === chk.dataset.check);
    if(!t) return;
    const t0Iso = todayIso();
    if(t.rrule){
      t.done_dates = t.done_dates || [];
      const i = t.done_dates.indexOf(t0Iso);
      if(i >= 0) t.done_dates.splice(i, 1); else t.done_dates.push(t0Iso);
    } else {
      t.done = !t.done;
      t.done_at = t.done ? new Date().toISOString() : '';
    }
    save(); renderActive(); return;
  }
  const ed = e.target.closest('[data-edit]');
  if(ed) return openModal(ed.dataset.edit);
  const pg = e.target.closest('[data-postpone]');
  if(pg){
    const t = TASKS.find(x => x.id === pg.dataset.postpone);
    if(t){ t.due = todayIso(); save(); renderActive(); }
    return;
  }
  const gen = e.target.closest('[data-gen]');
  if(gen) return void ($('rep-' + gen.dataset.gen).textContent = reportText(gen.dataset.gen));
  const cp = e.target.closest('[data-copy]');
  if(cp){
    const txt = reportText(cp.dataset.copy);
    navigator.clipboard.writeText(txt).then(() => alert('已复制，可粘贴到飞书/微信')).catch(() => alert('复制失败，请手动选择文本'));
    return;
  }
});

$('btnNew').addEventListener('click', () => openModal(null));
$('btnExport').addEventListener('click', exportJson);

function renderActive(){
  const on = document.querySelector('.tab.on').dataset.tab;
  if(on === 'today') renderToday();
  if(on === 'month') renderMonth();
  if(on === 'data') renderData();
}
function renderAll(){ renderActive(); if(document.querySelector('.tab.on').dataset.tab === 'report') renderReport(); }

/* ---------- 启动 ---------- */
(function init(){
  initTasks();
  const now = new Date();
  $('subTitle').textContent = (SEED ? SEED.month : now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0'))
    + ' · 共 ' + TASKS.length + ' 条任务 · 数据保存在本浏览器';
  renderToday();
})();

/* ---------- 嵌入模式：被门户 iframe 加载时隐藏自带页头，支持 #tab= 直达 ---------- */
(function(){
  let emb = false;
  try{ emb = window.self !== window.top; }catch(e){ emb = true; }
  if(!emb) return;
  document.documentElement.classList.add('embedded');
  const parse = () => { const m = (location.hash || '').match(/tab=(today|month|report|data)/); return m ? m[1] : null; };
  const t0 = parse();
  if(t0) switchTab(t0);
  window.addEventListener('hashchange', () => { const t = parse(); if(t && t !== document.querySelector('.tab.on').dataset.tab) switchTab(t); });
})();
</script>
</body>
</html>
